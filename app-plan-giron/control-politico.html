<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Control Político - Plan Girón</title>

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<header class="header">
<h1>Control Político</h1>
<p>Preguntas estratégicas para debates, seguimiento y vigilancia de la gestión municipal.</p>
</header>

<main class="contenedor">

<section class="card">

<h2>Seleccione un sector</h2>

<select id="selectorSectorControl" onchange="cargarPreguntasControl()">
<option value="">Seleccione un sector</option>
</select>

</section>

<section class="card">

<h2>Preguntas sugeridas</h2>

<div id="contenedorPreguntasControl">
<p class="texto-suave">Seleccione un sector para ver preguntas de control político.</p>
</div>

</section>

<section class="card">

<h2>Consulta Inteligente</h2>

<textarea
id="preguntaControlIA"
placeholder="Ejemplo: ¿Qué preguntas puede hacer un concejal sobre movilidad?">
</textarea>

<br><br>

<button
class="botonPrincipal"
onclick="consultarIA('preguntaControlIA','respuestaControlIA')">
Consultar IA
</button>

<div id="respuestaControlIA"></div>

</section>

</main>

<nav class="nav-inferior">
<a href="index.html">Inicio</a>
<a href="sectores.html">Sectores</a>
<a href="buscador.html">Buscar</a>
<a href="propuestas.html">Propuestas</a>
</nav>

<script src="js/data-loader.js"></script>
<script src="js/router.js"></script>
<script src="js/ia.js"></script>

<script>
function cargarSelectControl() {
    const select = document.getElementById("selectorSectorControl");
    const base = window.BASE_CONOCIMIENTO || {};

    if (!select || !base.sectores || !base.sectores.sectores) return;

    base.sectores.sectores.forEach(sector => {
        const option = document.createElement("option");
        option.value = sector.id;
        option.textContent = sector.nombre;
        select.appendChild(option);
    });
}

function cargarPreguntasControl() {
    const sectorId = document.getElementById("selectorSectorControl").value;
    const contenedor = document.getElementById("contenedorPreguntasControl");
    const base = window.BASE_CONOCIMIENTO || {};

    if (!sectorId) {
        contenedor.innerHTML = "<p class='texto-suave'>Seleccione un sector para ver preguntas de control político.</p>";
        return;
    }

    let preguntas = [];

    if (base.controlPolitico && base.controlPolitico.preguntas) {
        const bloque = base.controlPolitico.preguntas.find(item => item.sectorId === sectorId);
        if (bloque && bloque.preguntas) {
            preguntas = preguntas.concat(bloque.preguntas);
        }
    }

    if (base.preguntasControl && base.preguntasControl.sectores) {
        const sector = base.sectores.sectores.find(s => s.id === sectorId);
        const nombreSector = sector ? sector.nombre.toLowerCase() : "";

        const bloqueIA = base.preguntasControl.sectores.find(item =>
            nombreSector.includes(item.sector.toLowerCase()) ||
            item.sector.toLowerCase().includes(nombreSector)
        );

        if (bloqueIA && bloqueIA.preguntas) {
            preguntas = preguntas.concat(bloqueIA.preguntas);
        }
    }

    if (preguntas.length === 0) {
        contenedor.innerHTML = "<p class='texto-suave'>No hay preguntas registradas para este sector.</p>";
        return;
    }

    contenedor.innerHTML = preguntas.map(pregunta => `
        <div class="pregunta-control">
            <h4>Pregunta</h4>
            <p>${pregunta}</p>
        </div>
    `).join("");
}

document.addEventListener("DOMContentLoaded", () => {
    setTimeout(cargarSelectControl, 700);
});
</script>

</body>

</html>
