 <!doctype html>
    <html lang="es">

    <head>

      <meta charset="utf-8"/>
      <meta name="viewport" content="width=device-width, initial-scale=1"/>

      <title>Constructor MGA Pro | Banco de Proyectos</title>

      <link rel="manifest" href="pwa/manifest.webmanifest">

      <meta name="theme-color" content="#0b0f14"/>

      <link
        rel="icon"
        href="assets/icon-192.svg"
        type="image/svg+xml"
      >

      <link
        rel="stylesheet"
        href="css/styles.css"
      >

    </head>

    <body>

    <header class="top">

      <div class="brand">

        <div class="logo" aria-hidden="true">

          <img
            src="assets/icon-192.svg"
            alt=""
            style="width:26px;height:26px;border-radius:8px"
          >

        </div>

        <div>

          <div class="title">

            CONSTRUCTOR MGA PRO

          </div>

          <div class="subtitle">

            Sistema Inteligente para la Formulación de Proyectos de Inversión Pública

          </div>

        </div>

      </div>

      <nav class="nav">

        <button
          class="navbtn"
          id="btnNew"
          type="button"
        >
          + Nuevo Proyecto
        </button>

        <button
          class="navbtn"
          id="btnInstallBase"
          type="button"
        >
          Instalar Base Presupuestal (APU)
        </button>

        <input
          id="fileBase"
          type="file"
          accept=".xlsx,.xls"
          hidden
        >

        <button
          class="navbtn"
          id="btnExport"
          type="button"
        >
          Exportar Backup
        </button>

        <label class="navbtn filelike">

          Importar Backup

          <input
            id="fileImport"
            type="file"
            accept="application/json"
            hidden
          >

        </label>

        <label class="navbtn filelike">

          Importar Proyecto

          <input
            id="fileImportProject"
            type="file"
            accept="application/json"
            hidden
          >

        </label>

        <button
          class="navbtn danger"
          id="btnReset"
          type="button"
        >
          Borrar Todo
        </button>

      </nav>

    </header>

    <main class="container">

      <section
        class="grid kpis"
        id="kpis"
      >
      </section>

      <section class="card">

        <div class="cardhead">

          <div>

            <h2>

              Banco de Proyectos

            </h2>

            <div class="muted">

              Administre todos los proyectos de inversión formulados dentro del Constructor MGA Pro.

            </div>

          </div>

          <div class="row space">

            <input

              id="search"

              class="search"

              placeholder="Buscar proyecto, entidad, municipio o departamento..."

            />

          </div>

        </div>

        <div class="tablewrap">

          <table class="table">

            <thead>

              <tr>

                <th>Proyecto</th>

                <th>Entidad</th>

                <th>Ubicación</th>

                <th>Actualizado</th>

                <th>Valor Total</th>

                <th>Acciones</th>

              </tr>

            </thead>

            <tbody id="lista"></tbody>

          </table>

        </div>

        <div

          class="muted"

          id="empty"

          style="display:none"

        >

          Aún no existen proyectos registrados.

        </div>

      </section>

    </main>

    <script src="js/db.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/calc.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="js/base-import.js"></script>
    <script src="js/app.js"></script>

    </body>

    </html>
